<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TikTok login - Story Shorts Automation</title></head>
<body style="font-family:sans-serif;max-width:720px;margin:40px auto;padding:0 16px">
<h1>Login received</h1>
<p>Click <strong>Copy</strong>, then paste into the terminal.</p>
<textarea id="u" readonly style="width:100%;height:110px;font-family:monospace"></textarea>
<p><button onclick="navigator.clipboard.writeText(document.getElementById('u').value);this.textContent='Copied!'">Copy</button></p>
<p id="warn" style="color:#b00"></p>
<script>
  document.getElementById('u').value = location.href;
  if (!location.search.includes('code=')) {
    document.getElementById('warn').textContent =
      'No login code in this address. Run tiktok_login.py again and approve the app on the TikTok page.';
  }
</script>
</body>
</html>
